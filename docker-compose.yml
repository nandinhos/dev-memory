services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP:-1000}'
        NODE_VERSION: '22'
    image: dev-memory:latest
    container_name: dev-memory-app
    restart: unless-stopped
    ports:
      - '${APP_PORT:-9587}:80'
    environment:
      APP_ENV: '${APP_ENV:-production}'
      APP_DEBUG: '${APP_DEBUG:-false}'
      APP_URL: '${APP_URL:-http://localhost}'
      APP_KEY: '${APP_KEY}'
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: '${DB_DATABASE:-dev_memory}'
      DB_USERNAME: '${DB_USERNAME:-dev_memory}'
      DB_PASSWORD: '${DB_PASSWORD:-secret}'
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      MINIMAX_API_KEY: '${MINIMAX_API_KEY:-}'
      EMBEDDING_PROVIDER: '${EMBEDDING_PROVIDER:-minimax}'
      EMBEDDING_DIMENSIONS: '${EMBEDDING_DIMENSIONS:-1536}'
      MINIMAX_EMBED_BASE_URL: '${MINIMAX_EMBED_BASE_URL:-https://api.minimax.io/v1}'
      MINIMAX_EMBED_MODEL: '${MINIMAX_EMBED_MODEL:-embo-01}'
      OLLAMA_HOST: '${OLLAMA_HOST:-http://host.docker.internal:11434}'
      OLLAMA_EMBED_MODEL: '${OLLAMA_EMBED_MODEL:-nomic-embed-text}'
    volumes:
      - ./storage:/var/www/html/storage:delegated
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - dev-memory

  postgres:
    image: pgvector/pgvector:pg16
    container_name: dev-memory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${DB_DATABASE:-dev_memory}'
      POSTGRES_USER: '${DB_USERNAME:-dev_memory}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
    ports:
      - '15432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dev-memory

  redis:
    image: redis:7-alpine
    container_name: dev-memory-redis
    restart: unless-stopped
    ports:
      - '16379:6379'
    volumes:
      - redis_data:/data
    networks:
      - dev-memory

networks:
  dev-memory:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
