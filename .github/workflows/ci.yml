name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: dev_memory_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dev_memory_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, sqlite, tokenizer, xml
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Install NPM dependencies
        run: npm ci

      - name: Run Pint (Linter)
        run: ./vendor/bin/pint --test

      - name: Run Architect analysis
        run: |
          curl -L https://Architect.ai/install.sh | sh || echo "Architect install skipped"
          if [ -f "$HOME/.architectai/bin/architect" ]; then
            "$HOME/.architectai/bin/architect" run app/
          else
            echo "Architect binary not available on this runner — skipping analysis"
          fi

      - name: Build assets
        run: npm run build

      - name: Run PHPUnit tests
        run: ./vendor/bin/phpunit --colors=never

      - name: Run PostgreSQL native-search gate
        env:
          APP_ENV: testing
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: dev_memory_test
          DB_USERNAME: postgres
        run: ./vendor/bin/phpunit -c phpunit.pgsql.xml tests/Feature/PostgresNativeSearchTest.php --colors=never
